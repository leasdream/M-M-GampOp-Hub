<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MM GameOps Hub · 游戏运营工作台</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235e6ad2'/%3E%3Ctext x='16' y='21' font-size='12' font-family='Arial' font-weight='bold' fill='white' text-anchor='middle'%3EMM%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- 左侧导航栏 -->
  <aside class="sidebar">
    <a class="brand" href="#/overview">
      <span class="brand-logo">MM</span>
      <span class="brand-text">
        <strong>GameOps Hub</strong>
        <small>MM 游戏运营工作台</small>
      </span>
    </a>

    <nav class="nav">
      <div class="nav-group">工作台</div>
      <a class="nav-item" data-route="overview" href="#/overview">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
        <span class="nav-label">项目总览</span>
      </a>
      <a class="nav-item" data-route="tasks" href="#/tasks">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m3 17 2 2 4-4"/><path d="m3 7 2 2 4-4"/><path d="M13 8h8"/><path d="M13 18h8"/><path d="M13 13h8"/></svg>
        <span class="nav-label">我的任务</span>
        <span class="nav-badge" id="nav-task-badge"></span>
      </a>

      <div class="nav-group">版本与节点</div>
      <a class="nav-item" data-route="nodes" href="#/nodes">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>
        <span class="nav-label">节点管理</span>
      </a>

      <div class="nav-group">智能工具</div>
      <a class="nav-item" data-route="ai" href="#/ai">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4l1.8 4.5L18 10.5l-4.2 2L12 17l-1.8-4.5L6 10.5l4.2-2z"/><path d="M18.5 15.5l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7z"/><path d="M5.5 14.5l.5 1.3 1.3.5-1.3.5-.5 1.3-.5-1.3-1.3-.5 1.3-.5z"/></svg>
        <span class="nav-label">AI 内容助手</span>
      </a>
    </nav>

    <div class="sidebar-foot">
      <div class="user-card">
        <span class="avatar avatar-sm">我</span>
        <span class="user-meta">
          <strong>运营同学</strong>
          <small>版本运营组</small>
        </span>
      </div>
    </div>
  </aside>

  <!-- 右侧主区域：顶栏 + 页面内容（由 JS 渲染） -->
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main class="content" id="page"></main>
  </div>

  <!-- 弹窗容器 -->
  <div id="modal-root"></div>

  <!-- 注意：采用普通 script 而非 ES Module，这样双击 index.html 也能直接运行 -->
  <script src="js/data.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/components.js"></script>
  <script src="js/actions.js"></script>
  <script src="js/pages/overview.js"></script>
  <script src="js/pages/nodes.js"></script>
  <script src="js/pages/tasks.js"></script>
  <script src="js/pages/ai.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
